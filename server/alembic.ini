# Used by the `alembic` command line (e.g. to generate a migration).
# The server itself runs migrations on startup via ptrack.db.init_db().
[alembic]
script_location = src/ptrack/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# The database comes from PTRACK_DB (default: sqlite:///ptrack.db), see migrations/env.py.
